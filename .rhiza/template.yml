template-repository: jebel-quant/rhiza
template-branch: "v1.7.2"

# Destination paths the sync must not deliver. `.github/CONFIG.md` documents the
# secrets the rhiza workflows can use (PAT_TOKEN and friends); this repo does not
# configure them, so the file described settings that do not exist here. The two
# rulesets are declarative GitHub branch- and tag-protection definitions, and
# nothing in this repo applies them: no workflow reads them and no gate checks
# them, so they described repository settings that live elsewhere and could drift
# from them silently. Excluding them here is also what releases them from the
# check-managed-files hook, which refuses commits touching template.lock's
# `files:` list minus this `exclude:`.
exclude:
  - .github/CONFIG.md
  - .github/rulesets/main-branch-protection.json
  - .github/rulesets/tag-protection.json

profiles:
  - github-project

# Added on top of the profile rather than instead of it: `github-paper` is not part
# of `github-project`, and it is the only piece of the LaTeX support that has to be
# synced. The `paper`/`paper-clean` tasks themselves live in the pinned rhiza-task
# CLI and own no files here, so `make paper` works without this -- what the bundle
# adds is the CI workflow that compiles docs/paper/seb.tex under `--strict` and
# publishes the PDF (run artifact, book asset, and the `paper` branch).
templates:
  - github-paper
