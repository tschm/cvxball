[project]
name = 'cvxball'
version = "1.0.2"
description = "Fast computation of the smallest enclosing sphere"
authors = [{name='Thomas Schmelzer', email= 'thomas.schmelzer@gmail.com'}]
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# NumPy carries the method; SciPy carries its factorisation at large `d`.
#
# SciPy is here for exactly one thing: `qr_insert`, `qr_delete` and `qr_update`,
# the compiled Givens updates that let the solver repair the factorisation of its
# support in O(d r) instead of rebuilding it in O(d r^2). That is worth 1.3x at
# d = 250 and 3.5x at d = 8000, and nothing at all below d ~ 100 -- which is why
# the solver dispatches on dimension rather than always taking that route.
#
# It is a real cost imposed on everyone who installs this package, taken
# deliberately. Clarabel stays a development dependency: the cone program it
# serves lives in `experiments/` and is a reference, not a solver this ships.
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/cvxgrp/cvxball"
Repository = "https://github.com/cvxgrp/cvxball"

[dependency-groups]
dev = [
    "clarabel>=0.11.1",
    "scipy>=1.17.1",
    "kaleido==1.3.0",
    "plotly>=6.9.0",
    "marimo>=0.23.15",
    "matplotlib>=3.11.1",
]
# Every entry here is reached by a gate: `--cov` needs pytest-cov, `-n auto`
# pytest-xdist, `timeout = 60` in pytest.ini pytest-timeout, and
# tests/test_solver.py imports hypothesis. Note the rhiza test task injects its
# own copies with `--with`, including pytest-html, which is in no group at all --
# so this group is what a bare `uv run pytest` and the lowest-direct resolution
# job see, not what `make test` depends on.
test = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.157.2",
]
# No `lint` group. The ruff that runs comes from the ruff-pre-commit hook repo at
# its own pinned version, and the gates drive it through `uvx prek`; a `ruff` pin
# here would never execute and could silently disagree with the hook's.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvxball"]

# Back after a spell away. It existed to silence `import-untyped` for clarabel and
# scipy, and went when the cone program moved to `experiments/` and left `src`
# importing neither. `src/cvxball/_frame.py` imports scipy again, so mypy --strict
# (the `strict-types` job in audit.yml) needs it once more. Narrow on purpose: it
# names scipy alone, so the next untyped import has to be a deliberate decision
# rather than something this block quietly absorbs.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.deptry]
package_module_name_map = { clarabel = "clarabel", numpy = "numpy", scipy = "scipy", kaleido = "kaleido", plotly = "plotly", marimo = "marimo", matplotlib = "matplotlib" }

# No per-rule ignores. The DEP002 entry here existed for cvxpy-base, which was
# declared but never imported anywhere in the repository.

# CI settings. `ci-os-matrix` is the OS list the reusable rhiza CI workflow builds its
# test matrix from: it shells out to `rhiza-task ci-os-matrix`, and the default is
# `["ubuntu-latest"]` alone. Testing on macOS and Windows matters here because the solver
# is numerical -- BLAS/LAPACK backends differ per platform, so a tolerance that holds on
# Linux is not evidence it holds elsewhere.
#
# This used to live in `.rhiza/.env`, which rhiza v1.7.2 stopped managing and now treats
# as a developer-local channel a CI checkout never contains -- so that file has been
# removed and this table is the setting's only home. The table would win regardless,
# ranking above `.rhiza/.env` (layer 4 vs layer 2); the file's other two settings,
# SOURCE_FOLDER=src and MARIMO_FOLDER=docs/notebooks, matched rhiza-task's own defaults
# and so needed no home at all.
[tool.rhiza-task]
ci-os-matrix = ["ubuntu-latest", "macos-latest", "windows-latest"]

# Release versioning. Carried over from `.rhiza/.cfg.toml`, which rhiza v1.7.2 stopped
# managing: that path is never auto-discovered by bump-my-version (it predates
# jebel-quant/rhiza#1453), so leaving the config there meant `bump-my-version` silently
# fell back to `git describe` and could cut a release at a version that already exists.
# pyproject.toml is one of the files bump-my-version does search.
#
# `commit` and `tag` are false on purpose, and this is the one place the carried-over
# config had to change rather than move: the release flow folds a freshly generated
# CHANGELOG.md into the version-bump commit and pushes the tag itself, so letting
# bump-my-version do either would add a second commit and a duplicate tag. The old
# `pre_commit_hooks = ["uv sync", "git add uv.lock"]` went with them -- those run only
# as part of a commit bump-my-version no longer makes, so relocking is the release
# flow's job too.
[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = ["{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}", "{major}.{minor}.{patch}+build.{build_n}", "{major}.{minor}.{patch}-{release}.{pre_n}", "{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Chore: bump version {current_version} → {new_version}"
commit_args = ""

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "a",  # PEP 440 short form for alpha
    "beta",
    "b",  # PEP 440 short form for beta
    "rc",
    "prod"
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
